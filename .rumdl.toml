# rumdl (markdown linter) configuration. All rules use rumdl's defaults except:
#
# MD013 (line length) is disabled. This repo's prose docs are wrapped at ~80-88
# characters by convention, and rumdl cannot auto-fix line-length violations.
# Enforcing it would require manually rewrapping prose across most of doc/ with
# no tooling support.
#
# The cache directory is moved under tmp/ (gitignored)
[global]
cache-dir = "tmp/.rumdl_cache"
exclude = [
  "lib/**"
]

[MD013]
enabled = false
